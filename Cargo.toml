[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/butchprice1961-png/Rust-craft-"

[workspace.dependencies]
rustcraft-core = { path = "crates/rustcraft-core" }
rustcraft-assets = { path = "crates/rustcraft-assets" }

anyhow = "1.0.104"
dirs = "6.0.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
toml = "0.9.8"
tracing = "0.1.44"
wiremock = "0.6.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
