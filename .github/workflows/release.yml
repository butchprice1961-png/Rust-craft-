name: Release

# Builds, packages and smoke-tests the real distributables on each OS.
# Tags (v*) also publish a GitHub release with SHA-256 checksums.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Set this repository variable (or secret) to the Azure client id that has
  # been approved for Minecraft services; builds without it cannot sign in.
  RUSTCRAFT_MSA_CLIENT_ID: ${{ vars.RUSTCRAFT_MSA_CLIENT_ID }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri libxkbcommon-x11-0
      - run: cargo build --release --locked --workspace --bins
      - name: Fetch appimagetool 1.9.0
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - run: scripts/package-linux.sh ./appimagetool
      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE=$(ls dist/*.AppImage)
          "$APPIMAGE" --version
          RUSTCRAFT_HOME=$(mktemp -d) xvfb-run -a "$APPIMAGE" --smoke-test smoke-linux.png
          test -s smoke-linux.png
          "$APPIMAGE" --appimage-extract >/dev/null
          xvfb-run -a squashfs-root/usr/bin/rustcraft-client --game-dir "$(mktemp -d)" --seed 1 --render-distance 4 --screenshot smoke-linux-client.png
          test -s smoke-linux-client.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            smoke-linux*.png

  windows:
    runs-on: windows-2022
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace --bins
      - name: Package zip and installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/RustCraft | Out-Null
          Copy-Item target/release/*.exe dist/RustCraft/
          Copy-Item LICENSE dist/RustCraft/
          Compress-Archive -Path dist/RustCraft/* -DestinationPath "dist/RustCraft-$version-windows-x64.zip"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version "/DSRC=$PWD\dist\RustCraft" "/DOUT=$PWD\dist\RustCraft-$version-windows-x64-setup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign (when a certificate is configured)
        if: ${{ env.WINDOWS_CERT_PFX != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD dist\*.exe dist\RustCraft\*.exe
          Remove-Item cert.pfx
      - name: Smoke-test the installed build
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S", "/D=$env:RUNNER_TEMP\RustCraftInstall"
          $env:RUSTCRAFT_HOME = "$env:RUNNER_TEMP\rc-home"
          $p = Start-Process -Wait -PassThru -FilePath "$env:RUNNER_TEMP\RustCraftInstall\rustcraft.exe" -ArgumentList "--smoke-test", "$PWD\smoke-windows.png"
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke-windows.png)) { Get-Content "$env:RUSTCRAFT_HOME\logs\launcher.log"; exit 1 }
          $c = Start-Process -Wait -PassThru -FilePath "$env:RUNNER_TEMP\RustCraftInstall\rustcraft-client.exe" -ArgumentList "--game-dir", "$env:RUNNER_TEMP\client", "--seed", "1", "--render-distance", "4", "--screenshot", "$PWD\smoke-windows-client.png"
          if ($c.ExitCode -ne 0 -or -not (Test-Path smoke-windows-client.png)) { Get-ChildItem "$env:RUNNER_TEMP\client\crash-reports" -ErrorAction SilentlyContinue | Get-Content; exit 1 }
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\RustCraftInstall\uninstall.exe" -ArgumentList "/S"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            smoke-windows*.png

  macos:
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release --locked --workspace --bins --target aarch64-apple-darwin
          cargo build --release --locked --workspace --bins --target x86_64-apple-darwin
      - name: Import signing certificate (when configured)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - run: scripts/package-macos.sh
      - name: Notarize (when configured)
        if: ${{ env.APPLE_ID != '' }}
        run: |
          xcrun notarytool submit dist/*.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/*.dmg
      - name: Smoke-test the app from the mounted dmg
        run: |
          hdiutil attach dist/*.dmg -mountpoint /Volumes/RustCraft -nobrowse
          lipo -archs /Volumes/RustCraft/RustCraft.app/Contents/MacOS/rustcraft
          RUSTCRAFT_HOME=$(mktemp -d) /Volumes/RustCraft/RustCraft.app/Contents/MacOS/rustcraft --smoke-test "$PWD/smoke-macos.png"
          test -s smoke-macos.png
          /Volumes/RustCraft/RustCraft.app/Contents/MacOS/rustcraft-client --game-dir "$(mktemp -d)" --seed 1 --render-distance 4 --screenshot "$PWD/smoke-macos-client.png"
          test -s smoke-macos-client.png
          hdiutil detach /Volumes/RustCraft
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            smoke-macos*.png

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.zip' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: release/*
