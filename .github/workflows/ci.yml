name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # Real window, real process lifecycle: launch a stand-in game, check the
  # launcher closes, supervises and reopens. Runs on a virtual display.
  lifecycle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - run: cargo build --locked -p rustcraft-launcher
      - run: xvfb-run -a scripts/lifecycle-smoke.sh target/debug/rustcraft lifecycle-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-smoke
          path: lifecycle-out

  # Linux credential storage against a real Secret Service.
  keyring:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - run: |
          dbus-run-session -- sh -c 'echo -n test | gnome-keyring-daemon --unlock --components=secrets >/dev/null; RUSTCRAFT_TEST_KEYRING=1 cargo test --locked -p rustcraft-auth os_keyring'

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
